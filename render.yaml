# Render Blueprint: https://render.com/docs/blueprint-spec
# Two free services keep each process inside the 512 MB free-tier limit:
# the API peaks around 310 MB when a prediction loads the model, and the
# dashboard needs close to 300 MB on its own.
services:
  - type: web
    name: dashboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_MODE
        value: api
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_MODE
        value: ui
      - key: BACKEND_URL
        fromService:
          name: dashboard-api
          type: web
          property: host
