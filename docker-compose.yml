services:
  dashboard:
    build: .
    image: mental-health-risk-dashboard:local
    container_name: mental-health-risk-dashboard
    ports:
      - "8501:8501"
    environment:
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: "8000"
      BACKEND_URL: http://127.0.0.1:8000
      ALLOWED_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    restart: unless-stopped
