name: Keep API warm

# Render free services spin down after 15 minutes without inbound traffic.
# Pinging the API every 5 minutes keeps it awake so the dashboard never gets a 502.
#
# Budget: a free workspace gets 750 instance hours/month. Keeping the API awake
# 24/7 uses ~720-744 of them, leaving little room for the dashboard's own wake
# time. To stay well under the cap, narrow the cron to your active hours, e.g.:
#   - cron: "*/5 6-22 * * *"   # 06:00-22:59 UTC only
#
# GitHub also disables scheduled workflows after 60 days without repository
# activity. Re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping dashboard API health
        env:
          API_HEALTH_URL: https://dashboard-api-zkvb.onrender.com/api/v1/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$API_HEALTH_URL" || true)
            echo "Attempt $attempt -> HTTP ${code:-none}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "API did not return 200 after retries" >&2
          exit 1
